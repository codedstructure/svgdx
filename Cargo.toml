[package]
name = "svgdx"
version = "0.33.1"
description = "create SVG diagrams easily"
authors = ["Ben Bass <benbass@codedstructure.net>"]
repository = "https://github.com/codedstructure/svgdx"
keywords = ["svg", "diagrams"]
license = "MIT"
edition = "2024"
default-run = "svgdx"
exclude = ["/examples", "/docs"]
rust-version = "1.88"

[features]
default = ["cli", "server"]
cli = []
server = ["http", "httparse", "json", "tokio", "open"]
json = ["serde", "serde_json"]

[dependencies]
quick-xml = "0.42"
rand = { version = "0.10", default-features = false }
rand_pcg = "0.10"

http = { version = "1.3", optional = true }
httparse = { version = "1.10", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.44", features = ["rt-multi-thread", "fs", "net", "sync", "io-util"], optional = true }
open = { version = "5.3.2", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bin]]
name = "svgdx-server"
path = "src/bin/svgdx_server.rs"
required-features = ["server"]

[[bin]]
name = "svgdx"
path = "src/bin/svgdx.rs"
required-features = ["cli"]

[profile.release]
lto = true
opt-level = 's'

# wasm-pack docs imply that `profiling` profile should include debug info,
# but it doesn't seem to. (Useful e.g. for minimizing size with `twiggy`)
[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ['-g', '-O']
